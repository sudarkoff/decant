# Default branch: sync the main policy with the sync token from the decant-sync environment.
# Run it once by hand (workflow_dispatch) when you add it, so main is synced before any PR.
# Change `main` to your default branch, and the path if you set policy-path.
# Replace <release-sha> with the commit SHA of the decant release you pin.
name: decant main
on:
  push:
    branches: [main]
    paths:
      - decant.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    # Full ref, not ref_name: a tag named like the branch must not run this job.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: decant-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sudarkoff/decant/action@<release-sha> # v0.1.0
        with:
          mode: sync
          decant-url: ${{ vars.DECANT_URL }}
          sync-token: ${{ secrets.DECANT_SYNC_TOKEN }}
