# Add the bypass inputs, the decant job and the install job to your build workflow.
# Replace <release-sha> with the commit SHA of the decant release you pin.
#
# On a pull request, `setup` installs through the PR's overlay (/r/pr-<n>/), so allow entries the PR
# adds (for example a security fix still inside the cooldown) apply to its own build. The overlay only
# has them after a sync, and a needs: cannot reach the sync in decant-pr.yml (another workflow), so
# this workflow runs its own sync first (`needs: decant`). Syncing twice is harmless.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bypass:
        description: 'Emergency only: skip decant and install straight from npm and the Go proxy'
        type: boolean
        default: false
      bypass_reason:
        description: Why decant is being bypassed (required when bypass is set)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  decant:
    # Pull requests only: the default branch is synced by decant-main.yml with the sync token.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # sync reads decant.json at the PR's base commit
          persist-credentials: false
      - uses: sudarkoff/decant/action@<release-sha> # v0.1.0
        with:
          mode: sync
          decant-url: ${{ vars.DECANT_URL }}
          token: ${{ secrets.DECANT_CI_TOKEN }}
  install:
    needs: decant
    # Run after the sync on PRs, and also when it was skipped (push, workflow_dispatch).
    if: ${{ !cancelled() && (needs.decant.result == 'success' || needs.decant.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sudarkoff/decant/action@<release-sha> # v0.1.0
        with:
          mode: setup
          decant-url: ${{ vars.DECANT_URL }}
          token: ${{ secrets.DECANT_READ_TOKEN }}
          bypass: ${{ inputs.bypass || 'false' }}
          bypass-reason: ${{ inputs.bypass_reason }}
      - run: npm ci --ignore-scripts
